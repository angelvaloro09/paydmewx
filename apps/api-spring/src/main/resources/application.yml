spring:
  application:
    name: paydmex-api
  threads:
    virtual:
      enabled: true
  datasource:
    # JDBC form, e.g. jdbc:postgresql://<neon-host>/<db>?sslmode=require
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8787}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:}
  pey:
    base-url: ${PEY_BASE_URL:https://api.pey.mx}
    api-key: ${PEY_API_KEY:}
    webhook-secret: ${PEY_WEBHOOK_SECRET:}
    test-amount-override: ${PEY_TEST_AMOUNT_OVERRIDE:}
  llm:
    base-url: ${LLM_BASE_URL:https://openrouter.ai/api/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  dev-routes:
    enabled: ${ENABLE_DEV_ROUTES:false}
