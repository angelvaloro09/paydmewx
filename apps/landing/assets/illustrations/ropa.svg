<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" fill="none">
  <defs>
    <radialGradient id="sun-ropa" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E4007C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E4007C" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain-ropa" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- Paper background tint -->
  <rect width="480" height="600" fill="#FBF3F8"/>

  <!-- Soft sun blob behind subject -->
  <circle cx="240" cy="300" r="195" fill="url(#sun-ropa)"/>

  <g stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mexican detail: Papel picado flags above garment rack -->
    <path d="M36 52 Q240 70 444 52" fill="none"/>
    <g transform="translate(82,56)">
      <path d="M0 0 H68 V42 L54 32 L40 42 L34 32 L28 42 L14 32 L0 42 Z" fill="#00C853"/>
      <circle cx="34" cy="18" r="6" fill="#FBF3F8"/>
    </g>
    <g transform="translate(206,60)">
      <path d="M0 0 H68 V42 L54 32 L40 42 L34 32 L28 42 L14 32 L0 42 Z" fill="#E4007C"/>
      <rect x="22" y="11" width="24" height="14" rx="3" fill="#FBF3F8"/>
    </g>
    <g transform="translate(330,56)">
      <path d="M0 0 H68 V42 L54 32 L40 42 L34 32 L28 42 L14 32 L0 42 Z" fill="#2F6BFF"/>
      <circle cx="34" cy="18" r="6" fill="#FBF3F8"/>
    </g>

    <!-- Garment Rail Frame -->
    <rect x="70" y="142" width="340" height="10" rx="5" fill="#FFFFFF"/>
    <rect x="76" y="152" width="10" height="340" fill="#FAF9F6"/>
    <rect x="394" y="152" width="10" height="340" fill="#FAF9F6"/>
    <rect x="64" y="484" width="352" height="14" rx="6" fill="#FFFFFF"/>
    <circle cx="84" cy="507" r="9" fill="#0A0A0A"/>
    <circle cx="396" cy="507" r="9" fill="#0A0A0A"/>

    <!-- Hanger 1 + T-Shirt (Verde Pago) -->
    <path d="M150 142 C150 128 164 128 164 136 C164 142 156 146 156 154" fill="none"/>
    <path d="M126 172 L156 154 L186 172 Z" fill="#FAF9F6"/>
    <path d="M118 172 H194 L214 214 L190 226 L180 202 V336 H132 V202 L122 226 L98 214 Z" fill="#00C853"/>
    <path d="M142 172 C148 184 164 184 170 172" fill="#FBF3F8"/>
    <rect x="144" y="218" width="24" height="28" rx="4" fill="#B9F6CA"/>

    <!-- Hanger 2 + Embroidered Huipil / Dress (Rosa Mexicano) -->
    <path d="M242 142 C242 128 256 128 256 136 C256 142 248 146 248 154" fill="none"/>
    <path d="M218 172 L248 154 L278 172 Z" fill="#FAF9F6"/>
    <path d="M210 172 H286 L302 222 L282 228 L276 206 L292 388 H204 L220 206 L214 228 L194 222 Z" fill="#E4007C"/>
    <!-- Geometric yoke embroidery detail -->
    <rect x="228" y="182" width="40" height="32" rx="4" fill="#FFFFFF"/>
    <path d="M236 198 L248 188 L260 198 L248 208 Z" fill="#FF8A1F"/>
    <line x1="208" y1="364" x2="288" y2="364"/>

    <!-- Hanger 3 + Jacket (Cempasuchil & CoDi Blue) -->
    <path d="M336 142 C336 128 350 128 350 136 C350 142 342 146 342 154" fill="none"/>
    <path d="M312 172 L342 154 L372 172 Z" fill="#FAF9F6"/>
    <path d="M306 172 H378 L392 288 L372 292 L366 214 V348 H318 V214 L312 292 L292 288 Z" fill="#FF8A1F"/>
    <line x1="342" y1="184" x2="342" y2="348"/>
    <path d="M328 172 L342 204 L356 172 Z" fill="#2F6BFF"/>

    <!-- Folded garments on bottom rack -->
    <rect x="116" y="456" width="88" height="14" rx="4" fill="#2F6BFF"/>
    <rect x="112" y="470" width="96" height="14" rx="4" fill="#FFFFFF"/>
    <rect x="268" y="456" width="88" height="14" rx="4" fill="#00C853"/>
    <rect x="264" y="470" width="96" height="14" rx="4" fill="#F8BBD0"/>

    <!-- Ground line -->
    <line x1="40" y1="516" x2="440" y2="516"/>
  </g>

  <rect width="480" height="600" filter="url(#grain-ropa)" opacity="0.06" pointer-events="none"/>
</svg>
