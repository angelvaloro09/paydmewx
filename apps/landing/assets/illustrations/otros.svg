<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" fill="none">
  <defs>
    <radialGradient id="sun-otros" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C853" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#00C853" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain-otros" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- Paper background tint -->
  <rect width="480" height="600" fill="#F2FBF6"/>

  <!-- Soft sun blob behind subject -->
  <circle cx="240" cy="305" r="195" fill="url(#sun-otros)"/>

  <g stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mexican detail: Tianguis Striped Awning + Papel Picado -->
    <path d="M56 84 H424 L442 138 H38 Z" fill="#FFFFFF"/>
    <path d="M56 84 H110 L102 138 H38 Z" fill="#00C853"/>
    <path d="M162 84 H216 L214 138 H156 Z" fill="#E4007C"/>
    <path d="M266 84 H320 L326 138 H268 Z" fill="#2F6BFF"/>
    <path d="M370 84 H424 L442 138 H380 Z" fill="#FF8A1F"/>

    <!-- Papel picado hanging under awning -->
    <g transform="translate(86,138)">
      <path d="M0 0 H64 V38 L50 28 L36 38 L32 28 L28 38 L14 28 L0 38 Z" fill="#FF8A1F"/>
      <circle cx="32" cy="16" r="5" fill="#F2FBF6"/>
    </g>
    <g transform="translate(208,138)">
      <path d="M0 0 H64 V38 L50 28 L36 38 L32 28 L28 38 L14 28 L0 38 Z" fill="#00C853"/>
      <circle cx="32" cy="16" r="5" fill="#F2FBF6"/>
    </g>
    <g transform="translate(330,138)">
      <path d="M0 0 H64 V38 L50 28 L36 38 L32 28 L28 38 L14 28 L0 38 Z" fill="#E4007C"/>
      <circle cx="32" cy="16" r="5" fill="#F2FBF6"/>
    </g>

    <!-- Stall side poles -->
    <rect x="76" y="138" width="10" height="270" fill="#FAF9F6"/>
    <rect x="394" y="138" width="10" height="270" fill="#FAF9F6"/>

    <!-- Sparkle stars bursting from the surprise box -->
    <path d="M240 190 L247 212 L270 219 L247 226 L240 248 L233 226 L210 219 L233 212 Z" fill="#FF8A1F"/>
    <path d="M148 220 L153 234 L168 239 L153 244 L148 258 L143 244 L128 239 L143 234 Z" fill="#E4007C"/>
    <path d="M336 214 L341 228 L356 233 L341 238 L336 252 L331 238 L316 233 L331 228 Z" fill="#2F6BFF"/>
    <circle cx="188" cy="204" r="6" fill="#00C853"/>
    <circle cx="296" cy="202" r="6" fill="#FF8A1F"/>

    <!-- Open Surprise Box on stall counter -->
    <!-- Open flaps -->
    <path d="M168 292 L126 262 L152 240 L198 272 Z" fill="#FFD8B5"/>
    <path d="M312 292 L354 262 L328 240 L282 272 Z" fill="#FFD8B5"/>
    <!-- Box body -->
    <rect x="168" y="292" width="144" height="116" rx="6" fill="#FF8A1F"/>
    <!-- Vertical & Horizontal Ribbon -->
    <rect x="226" y="292" width="28" height="116" fill="#E4007C"/>
    <rect x="168" y="338" width="144" height="24" fill="#E4007C"/>
    <!-- Ribbon bow on top -->
    <path d="M240 292 C214 264 196 286 226 292" fill="#00C853"/>
    <path d="M240 292 C266 264 284 286 254 292" fill="#00C853"/>

    <!-- Side items on counter (plant pot & ceramic mug) -->
    <path d="M104 368 H142 L136 408 H110 Z" fill="#2F6BFF"/>
    <path d="M123 368 C108 350 112 334 123 346 C134 334 138 350 123 368 Z" fill="#00C853"/>

    <rect x="338" y="366" width="36" height="42" rx="6" fill="#FFFFFF"/>
    <path d="M374 374 C386 374 386 396 374 396" fill="none"/>

    <!-- Stall Counter -->
    <rect x="60" y="408" width="360" height="20" rx="5" fill="#FFFFFF"/>
    <rect x="72" y="428" width="336" height="88" rx="6" fill="#00C853"/>
    <rect x="96" y="446" width="132" height="54" rx="4" fill="#FAF9F6"/>
    <rect x="252" y="446" width="132" height="54" rx="4" fill="#FAF9F6"/>

    <!-- Ground line -->
    <line x1="40" y1="516" x2="440" y2="516"/>
  </g>

  <rect width="480" height="600" filter="url(#grain-otros)" opacity="0.06" pointer-events="none"/>
