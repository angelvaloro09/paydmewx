<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" fill="none">
  <defs>
    <radialGradient id="sun-servicios" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8A1F" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF8A1F" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain-servicios" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- Paper background tint -->
  <rect width="480" height="600" fill="#FFF8EE"/>

  <!-- Soft sun blob behind subject -->
  <circle cx="240" cy="300" r="195" fill="url(#sun-servicios)"/>

  <g stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mexican detail: Talavera tile workshop arch header -->
    <rect x="68" y="58" width="344" height="46" rx="8" fill="#FFFFFF"/>
    <g transform="translate(84,66)">
      <rect width="64" height="30" rx="4" fill="#C5D8FF"/>
      <path d="M32 4 L44 15 L32 26 L20 15 Z" fill="#2F6BFF"/>
    </g>
    <g transform="translate(166,66)">
      <rect width="64" height="30" rx="4" fill="#FFD8B5"/>
      <path d="M32 4 L44 15 L32 26 L20 15 Z" fill="#FF8A1F"/>
    </g>
    <g transform="translate(248,66)">
      <rect width="64" height="30" rx="4" fill="#B9F6CA"/>
      <path d="M32 4 L44 15 L32 26 L20 15 Z" fill="#00C853"/>
    </g>
    <g transform="translate(330,66)">
      <rect width="64" height="30" rx="4" fill="#F8BBD0"/>
      <path d="M32 4 L44 15 L32 26 L20 15 Z" fill="#E4007C"/>
    </g>

    <!-- Pegboard tool wall -->
    <rect x="82" y="128" width="316" height="196" rx="10" fill="#FAF9F6"/>
    <circle cx="110" cy="154" r="2.5" fill="#0A0A0A"/>
    <circle cx="150" cy="154" r="2.5" fill="#0A0A0A"/>
    <circle cx="190" cy="154" r="2.5" fill="#0A0A0A"/>
    <circle cx="230" cy="154" r="2.5" fill="#0A0A0A"/>
    <circle cx="270" cy="154" r="2.5" fill="#0A0A0A"/>
    <circle cx="310" cy="154" r="2.5" fill="#0A0A0A"/>
    <circle cx="350" cy="154" r="2.5" fill="#0A0A0A"/>

    <!-- Big Open-End Wrench hanging on left -->
    <g transform="translate(114,164)">
      <path d="M24 0 C8 0 0 14 6 28 L18 18 L30 24 L26 36 C40 38 50 26 46 10 L34 22 L22 14 Z" fill="#2F6BFF"/>
      <rect x="19" y="34" width="14" height="104" rx="5" fill="#C5D8FF"/>
      <circle cx="26" cy="124" r="5" fill="#FAF9F6"/>
    </g>

    <!-- Screwdriver in middle -->
    <g transform="translate(208,162)">
      <rect x="8" y="0" width="22" height="52" rx="8" fill="#00C853"/>
      <line x1="14" y1="12" x2="14" y2="40"/>
      <line x1="24" y1="12" x2="24" y2="40"/>
      <rect x="16" y="52" width="6" height="64" fill="#FFFFFF"/>
      <path d="M14 116 H24 L21 130 H17 Z" fill="#0A0A0A"/>
    </g>

    <!-- Keyring with 2 Keys on right -->
    <circle cx="322" cy="184" r="22" fill="none" stroke-width="3"/>
    <!-- Key 1 (Cempasuchil) -->
    <g transform="translate(288,196)">
      <circle cx="22" cy="20" r="16" fill="#FF8A1F"/>
      <circle cx="22" cy="20" r="6" fill="#FAF9F6"/>
      <path d="M18 36 V92 H34 V82 H26 V74 H36 V64 H26 V36 Z" fill="#FF8A1F"/>
    </g>
    <!-- Key 2 (Rosa Mexicano) -->
    <g transform="translate(332,196)">
      <circle cx="22" cy="20" r="16" fill="#E4007C"/>
      <circle cx="22" cy="20" r="6" fill="#FAF9F6"/>
      <path d="M18 36 V84 H32 V74 H26 V66 H34 V56 H26 V36 Z" fill="#E4007C"/>
    </g>

    <!-- Classic Metal Toolbox on Workbench -->
    <path d="M196 348 V328 C196 322 202 318 210 318 H270 C278 318 284 322 284 328 V348" fill="none" stroke-width="3"/>
    <path d="M116 348 H364 L376 382 H104 Z" fill="#FF8A1F"/>
    <rect x="104" y="382" width="272" height="114" rx="8" fill="#E4007C"/>
    <line x1="104" y1="422" x2="376" y2="422"/>
    <!-- Toolbox latches -->
    <rect x="156" y="408" width="24" height="28" rx="4" fill="#FFFFFF"/>
    <rect x="300" y="408" width="24" height="28" rx="4" fill="#FFFFFF"/>
    <rect x="216" y="446" width="48" height="24" rx="4" fill="#FFD8B5"/>

    <!-- Workbench surface & Ground line -->
    <rect x="56" y="496" width="368" height="20" rx="4" fill="#FFFFFF"/>
    <line x1="40" y1="516" x2="440" y2="516"/>
  </g>

  <rect width="480" height="600" filter="url(#grain-servicios)" opacity="0.06" pointer-events="none"/>
</svg>
