      <line x1="60" y1="22" x2="70" y2="18"/>
      <rect x="-2" y="56" width="124" height="14" rx="5" fill="#FFFFFF"/>
    </g>

    <!-- Middle Shelf: Right Sneaker (CoDi Blue) -->
    <g transform="translate(256,292)">
      <path d="M0 56 H118 C124 56 124 42 112 38 L74 26 L56 6 H16 L6 30 Z" fill="#2F6BFF"/>
      <path d="M28 24 L64 44 H42 L16 28 Z" fill="#FFD8B5"/>
      <line x1="54" y1="14" x2="64" y2="10"/>
      <line x1="60" y1="22" x2="70" y2="18"/>
      <rect x="-2" y="56" width="124" height="14" rx="5" fill="#FFFFFF"/>
