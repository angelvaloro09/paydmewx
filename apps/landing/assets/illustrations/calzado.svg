    <rect x="76" y="140" width="12" height="376" rx="4" fill="#FAF9F6"/>
    <rect x="392" y="140" width="12" height="376" rx="4" fill="#FAF9F6"/>
    <rect x="68" y="236" width="344" height="14" rx="4" fill="#FFFFFF"/>
    <rect x="68" y="362" width="344" height="14" rx="4" fill="#FFFFFF"/>
    <rect x="68" y="488" width="344" height="14" rx="4" fill="#FFFFFF"/>

    <!-- Top Shelf: Left Sneaker (Verde Pago) -->
    <g transform="translate(106,166)">
      <path d="M0 56 H118 C122 56 124 44 114 40 L76 28 L58 6 H14 L6 28 C2 36 0 46 0 56 Z" fill="#00C853"/>
      <path d="M34 22 L72 42 L56 48 L24 30 Z" fill="#FFFFFF"/>
