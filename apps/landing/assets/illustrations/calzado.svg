<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" fill="none">
  <defs>
    <radialGradient id="sun-calzado" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2F6BFF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#2F6BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain-calzado" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- Paper background tint -->
  <rect width="480" height="600" fill="#EFF4FF"/>

  <!-- Soft sun blob behind subject -->
  <circle cx="240" cy="300" r="195" fill="url(#sun-calzado)"/>

  <g stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mexican detail: Talavera tile frieze header -->
    <rect x="64" y="56" width="352" height="52" rx="8" fill="#FFFFFF"/>
    <g transform="translate(76,64)">
      <rect width="68" height="36" rx="4" fill="#C5D8FF"/>
      <path d="M34 4 L48 18 L34 32 L20 18 Z" fill="#2F6BFF"/>
      <circle cx="34" cy="18" r="4" fill="#FFFFFF"/>
    </g>
    <g transform="translate(158,64)">
      <rect width="68" height="36" rx="4" fill="#C5D8FF"/>
      <path d="M34 4 L48 18 L34 32 L20 18 Z" fill="#FF8A1F"/>
      <circle cx="34" cy="18" r="4" fill="#FFFFFF"/>
    </g>
    <g transform="translate(240,64)">
      <rect width="68" height="36" rx="4" fill="#C5D8FF"/>
      <path d="M34 4 L48 18 L34 32 L20 18 Z" fill="#00C853"/>
      <circle cx="34" cy="18" r="4" fill="#FFFFFF"/>
    </g>
    <g transform="translate(322,64)">
      <rect width="80" height="36" rx="4" fill="#C5D8FF"/>
      <path d="M40 4 L54 18 L40 32 L26 18 Z" fill="#E4007C"/>
      <circle cx="40" cy="18" r="4" fill="#FFFFFF"/>
