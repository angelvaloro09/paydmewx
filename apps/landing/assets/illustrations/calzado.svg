    <g transform="translate(256,158)">
      <path d="M0 64 H116 C120 64 122 52 110 46 L74 34 L62 0 H12 L6 36 C2 44 0 54 0 64 Z" fill="#FF8A1F"/>
      <circle cx="32" cy="24" r="9" fill="#FFFFFF"/>
      <line x1="56" y1="12" x2="68" y2="10"/>
      <line x1="60" y1="22" x2="72" y2="20"/>
      <line x1="64" y1="32" x2="76" y2="30"/>
      <rect x="-2" y="64" width="122" height="14" rx="5" fill="#FAF9F6"/>
