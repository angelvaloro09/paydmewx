<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" fill="none">
  <defs>
    <radialGradient id="sun-abarrotes" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C853" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#00C853" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain-abarrotes" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- Paper background tint -->
  <rect width="480" height="600" fill="#EEFAF2"/>

  <!-- Soft sun blob behind subject -->
  <circle cx="240" cy="300" r="195" fill="url(#sun-abarrotes)"/>

  <g stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mexican detail: Papel picado banner at top -->
    <path d="M36 48 Q240 66 444 48" fill="none"/>
    <g transform="translate(88,52)">
      <path d="M0 0 H66 V40 L52 30 L38 40 L33 30 L28 40 L14 30 L0 40 Z" fill="#00C853"/>
      <circle cx="33" cy="17" r="6" fill="#EEFAF2"/>
    </g>
    <g transform="translate(207,56)">
      <path d="M0 0 H66 V40 L52 30 L38 40 L33 30 L28 40 L14 30 L0 40 Z" fill="#FF8A1F"/>
      <path d="M33 9 L42 18 L33 27 L24 18 Z" fill="#EEFAF2"/>
    </g>
    <g transform="translate(326,52)">
      <path d="M0 0 H66 V40 L52 30 L38 40 L33 30 L28 40 L14 30 L0 40 Z" fill="#E4007C"/>
      <circle cx="33" cy="17" r="6" fill="#EEFAF2"/>
    </g>

    <!-- Store Shelves behind counter -->
    <rect x="76" y="122" width="328" height="224" rx="8" fill="#FAF9F6"/>
    <rect x="76" y="194" width="328" height="10" fill="#FFFFFF"/>
    <rect x="76" y="272" width="328" height="10" fill="#FFFFFF"/>

    <!-- Top shelf items (jars, cans, bottles) -->
    <rect x="102" y="146" width="32" height="48" rx="4" fill="#FF8A1F"/>
    <rect x="106" y="138" width="24" height="8" rx="2" fill="#FFFFFF"/>
    <rect x="148" y="152" width="28" height="42" rx="4" fill="#E4007C"/>
    <rect x="192" y="136" width="26" height="58" rx="6" fill="#00C853"/>
    <rect x="230" y="136" width="26" height="58" rx="6" fill="#2F6BFF"/>
    <rect x="276" y="148" width="44" height="46" rx="4" fill="#FFD8B5"/>
    <rect x="334" y="142" width="38" height="52" rx="4" fill="#B9F6CA"/>

    <!-- Second shelf items (boxes & packages) -->
    <rect x="102" y="218" width="46" height="54" rx="4" fill="#2F6BFF"/>
    <circle cx="125" cy="245" r="10" fill="#FFFFFF"/>
    <rect x="162" y="226" width="38" height="46" rx="4" fill="#00C853"/>
    <rect x="214" y="216" width="52" height="56" rx="4" fill="#FF8A1F"/>
    <rect x="280" y="224" width="42" height="48" rx="4" fill="#E4007C"/>
    <rect x="336" y="220" width="36" height="52" rx="4" fill="#C5D8FF"/>

    <!-- Weighing Scale on left of counter -->
    <path d="M108 312 H204 L190 330 H122 Z" fill="#FFFFFF"/>
    <rect x="148" y="330" width="16" height="18" fill="#F1EFEA"/>
    <path d="M116 348 H196 L206 404 H106 Z" fill="#00C853"/>
    <circle cx="156" cy="376" r="18" fill="#FFFFFF"/>
    <line x1="156" y1="376" x2="166" y2="366"/>
    <!-- Fruit on scale pan -->
    <circle cx="144" cy="300" r="12" fill="#FF8A1F"/>
    <circle cx="168" cy="302" r="11" fill="#E4007C"/>

    <!-- Woven Market Basket on right of counter -->
    <path d="M276 292 C276 254 364 254 364 292" fill="none" stroke-width="3"/>
    <path d="M254 328 H386 L368 404 H272 Z" fill="#FF8A1F"/>
    <rect x="248" y="316" width="144" height="14" rx="5" fill="#FFD8B5"/>
    <!-- Basket weave crosshatch -->
    <line x1="282" y1="330" x2="294" y2="404"/>
    <line x1="312" y1="330" x2="318" y2="404"/>
    <line x1="342" y1="330" x2="338" y2="404"/>
    <line x1="368" y1="330" x2="356" y2="404"/>
    <line x1="262" y1="354" x2="378" y2="354"/>
    <line x1="268" y1="378" x2="372" y2="378"/>
    <!-- Groceries peeking from basket -->
    <rect x="282" y="286" width="28" height="30" rx="4" fill="#00C853"/>
    <circle cx="332" cy="304" r="14" fill="#E4007C"/>
    <rect x="342" y="282" width="22" height="34" rx="4" fill="#2F6BFF"/>

    <!-- Store Counter with Talavera tiles -->
    <rect x="56" y="404" width="368" height="20" rx="5" fill="#FFFFFF"/>
    <rect x="68" y="424" width="344" height="92" rx="6" fill="#FAF9F6"/>
    <rect x="96" y="444" width="52" height="52" rx="4" fill="#C5D8FF"/>
    <path d="M122 452 L138 470 L122 488 L106 470 Z" fill="#2F6BFF"/>
    <rect x="214" y="444" width="52" height="52" rx="4" fill="#B9F6CA"/>
    <path d="M240 452 L256 470 L240 488 L224 470 Z" fill="#00C853"/>
    <rect x="332" y="444" width="52" height="52" rx="4" fill="#FFD8B5"/>
    <path d="M358 452 L374 470 L358 488 L342 470 Z" fill="#FF8A1F"/>

    <!-- Ground line -->
    <line x1="40" y1="516" x2="440" y2="516"/>
  </g>

  <rect width="480" height="600" filter="url(#grain-abarrotes)" opacity="0.06" pointer-events="none"/>
</svg>
