<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" fill="none">
  <defs>
    <radialGradient id="sun-comida" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8A1F" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF8A1F" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain-comida" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- Paper background tint -->
  <rect width="480" height="600" fill="#FFF6EE"/>

  <!-- Soft sun blob behind subject -->
  <circle cx="240" cy="310" r="190" fill="url(#sun-comida)"/>

  <g stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Papel picado banner at top -->
    <path d="M24 52 Q240 68 456 52" fill="none"/>
    <g transform="translate(56,55)">
      <path d="M0 0 H64 V44 L52 34 L40 44 L32 34 L24 44 L12 34 L0 44 Z" fill="#E4007C"/>
      <circle cx="20" cy="18" r="5" fill="#FFF6EE"/>
      <circle cx="44" cy="18" r="5" fill="#FFF6EE"/>
      <path d="M28 28 L32 22 L36 28 Z" fill="#FFF6EE"/>
    </g>
    <g transform="translate(148,59)">
      <path d="M0 0 H64 V44 L52 34 L40 44 L32 34 L24 44 L12 34 L0 44 Z" fill="#00C853"/>
      <rect x="18" y="12" width="28" height="14" rx="3" fill="#FFF6EE"/>
    </g>
    <g transform="translate(268,59)">
      <path d="M0 0 H64 V44 L52 34 L40 44 L32 34 L24 44 L12 34 L0 44 Z" fill="#FF8A1F"/>
      <circle cx="32" cy="19" r="7" fill="#FFF6EE"/>
    </g>
    <g transform="translate(360,55)">
      <path d="M0 0 H64 V44 L52 34 L40 44 L32 34 L24 44 L12 34 L0 44 Z" fill="#2F6BFF"/>
      <circle cx="20" cy="18" r="5" fill="#FFF6EE"/>
      <circle cx="44" cy="18" r="5" fill="#FFF6EE"/>
    </g>

    <!-- Stall side poles -->
    <rect x="78" y="180" width="10" height="230" fill="#F1EFEA"/>
    <rect x="392" y="180" width="10" height="230" fill="#F1EFEA"/>

    <!-- Tianguis striped awning -->
    <path d="M56 130 H424 L444 186 H36 Z" fill="#FAF9F6"/>
    <path d="M56 130 H110 L100 186 H36 Z" fill="#E4007C"/>
    <path d="M164 130 H216 L212 186 H156 Z" fill="#FF8A1F"/>
    <path d="M264 130 H316 L324 186 H268 Z" fill="#00C853"/>
    <path d="M370 130 H424 L444 186 H380 Z" fill="#E4007C"/>

    <!-- Awning valance scallops -->
    <path d="M36 186 H444 V200 C430 212 414 212 400 200 C386 212 370 212 356 200 C342 212 326 212 312 200 C298 212 282 212 268 200 C254 212 238 212 224 200 C210 212 194 212 180 200 C166 212 150 212 136 200 C122 212 106 212 92 200 C78 212 62 212 48 200 L36 200 Z" fill="#FFD8B5"/>

    <!-- Steam lines rising from comal -->
    <path d="M175 300 C168 282 184 270 176 252" fill="none"/>
    <path d="M210 292 C202 272 220 260 212 240" fill="none"/>
    <path d="M245 300 C238 282 254 270 246 252" fill="none"/>

    <!-- Comal (round griddle) on counter -->
    <ellipse cx="210" cy="348" rx="92" ry="24" fill="#5B5B57"/>
    <ellipse cx="210" cy="344" rx="84" ry="18" fill="#0A0A0A"/>
    <!-- Comal handles -->
    <path d="M118 346 C104 342 104 354 118 352" fill="none"/>
    <path d="M302 346 C316 342 316 354 302 352" fill="none"/>

    <!-- Tacos and tortillas on the comal -->
    <path d="M148 344 C148 322 188 322 188 344 Z" fill="#FF8A1F"/>
    <path d="M156 336 C164 330 174 330 180 336" fill="none"/>
    <circle cx="164" cy="333" r="3" fill="#00C853"/>
    <circle cx="174" cy="334" r="3" fill="#E4007C"/>

    <path d="M196 348 C196 326 236 326 236 348 Z" fill="#FF8A1F"/>
    <circle cx="210" cy="336" r="3.5" fill="#00C853"/>
    <circle cx="222" cy="337" r="3.5" fill="#E4007C"/>

    <ellipse cx="260" cy="340" rx="18" ry="8" fill="#FFD8B5"/>

    <!-- Salsa bowls on right side of counter -->
    <path d="M322 342 H360 L354 362 H328 Z" fill="#FFFFFF"/>
    <ellipse cx="341" cy="342" rx="19" ry="6" fill="#00C853"/>
    <path d="M366 346 H402 L396 364 H372 Z" fill="#FFFFFF"/>
    <ellipse cx="384" cy="346" rx="18" ry="6" fill="#E4007C"/>

    <!-- Stall counter body -->
    <rect x="64" y="364" width="352" height="24" rx="6" fill="#FFFFFF"/>
    <rect x="74" y="388" width="332" height="128" rx="8" fill="#FF8A1F"/>
    <rect x="92" y="406" width="144" height="92" rx="6" fill="#FAF9F6"/>
    <rect x="252" y="406" width="136" height="92" rx="6" fill="#FAF9F6"/>

    <!-- QR CoDi stand on counter -->
    <rect x="334" y="284" width="46" height="54" rx="6" fill="#2F6BFF"/>
    <rect x="342" y="292" width="30" height="30" rx="3" fill="#FFFFFF"/>
    <rect x="347" y="297" width="7" height="7" fill="#0A0A0A"/>
    <rect x="360" y="297" width="7" height="7" fill="#0A0A0A"/>
    <rect x="347" y="310" width="7" height="7" fill="#0A0A0A"/>
    <rect x="357" y="307" width="10" height="10" fill="#00C853"/>
    <path d="M348 338 L342 364 H372 L366 338 Z" fill="#F1EFEA"/>

    <!-- Ground line -->
    <line x1="40" y1="516" x2="440" y2="516"/>
  </g>

  <!-- Subtle grain overlay (6% opacity) -->
  <rect width="480" height="600" filter="url(#grain-comida)" opacity="0.06" pointer-events="none"/>
</svg>
